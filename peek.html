<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Peek</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 16px 24px; box-sizing: border-box; }
  .bar { display: flex; justify-content: space-between; font-size: 13px; color: #666; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c33; margin-right: 6px; }
  .dot.on { background: #2c6; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  #final { font-size: clamp(32px, 11vw, 64px); font-weight: 700; line-height: 1.1; word-break: break-word; }
  #live { font-size: 22px; color: #8ab4f8; min-height: 28px; word-break: break-word; }
  #when { font-size: 14px; color: #777; }
  button { background: #222; color: #ccc; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; }
</style>
</head>
<body>
<div class="bar"><span><span class="dot" id="dot"></span><span id="room"></span></span><span id="rev"></span></div>
<main>
  <div id="live"></div>
  <div id="final">—</div>
  <div id="when"></div>
</main>
<button id="reset" type="button">Nulstil</button>
<script src="config.js"></script>
<script>
(() => {
  const C = window.FG_CONFIG || {};
  const p = new URLSearchParams(location.search);
  const room = (p.get('r') || C.room || 'magi').replace(/[^a-zA-Z0-9-]/g, '').toLowerCase();
  const url = (C.relay || '').replace(/\/$/, '') + '/r/' + room;
  const $ = (id) => document.getElementById(id);
  $('room').textContent = 'rum: ' + room;
  let lastAt = 0, finalAt = 0;

  function ago() {
    if (!finalAt) { $('when').textContent = ''; return; }
    const s = Math.round((Date.now() - finalAt) / 1000);
    $('when').textContent = s < 60 ? `for ${s} s siden` : `for ${Math.round(s / 60)} min siden`;
  }
  setInterval(ago, 1000);

  function show(st) {
    const g = st.google, l = st.googleLive;
    $('live').textContent = l && !l.done && l.q ? '✎ ' + l.q : '';
    if (g && g.q) {
      $('final').textContent = g.q;
      finalAt = g.at || 0;
      if (g.at && g.at !== lastAt) { if (lastAt && navigator.vibrate) navigator.vibrate([80, 60, 80]); lastAt = g.at; }
    } else { $('final').textContent = '—'; finalAt = 0; }
    ago();
  }

  const es = new EventSource(url + '/events');
  es.onopen = () => $('dot').classList.add('on');
  es.onerror = () => $('dot').classList.remove('on');
  es.onmessage = (e) => { try { const d = JSON.parse(e.data); $('rev').textContent = '#' + d.rev; show(d.state || {}); } catch (_) {} };

  $('reset').onclick = () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ google: null, googleLive: null }) });
})();
</script>
</body>
</html>
